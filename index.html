<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Guardian Interfaz</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Personalización de la web</h1>

    <div id="contenedor-bienvenida"></div>

    <form id="formulario">

        <label for="nombre">Nombre de Usuario:</label>
        <input type="text" id="nombre" placeholder="Escribe tu nombre" required>

        <br><br>

        <label for="color">Color de fondo:</label>
        <input type="color" id="color" value="#ffffff">

        <br><br>

        <label for="modo">Tema visual:</label>

        <select id="modo">
            <option value="claro">Modo Claro</option>
            <option value="oscuro">Modo Oscuro</option>
        </select>

        <br><br>

        <button type="submit" id="guardar">
            Guardar Preferencias
        </button>

        <button type="button" id="restablecer">
            Restablecer Interfaz
        </button>

    </form>

    <script src="script.js"></script>

</body>
</html>
